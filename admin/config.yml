# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms@0.187.0/schema/sveltia-cms.json

backend:
  name: github
  repo: 9tianchang/Answer
  branch: master
  auth_methods: [token]
  commit_messages:
    create: '发布文章「{{slug}}」'
    update: '更新文章「{{slug}}」'
    delete: '删除文章「{{slug}}」'

site_url: https://9tianchang.github.io/Answer/
display_url: https://9tianchang.github.io/Answer/
logo_url: https://9tianchang.github.io/Answer/og.png
locale: zh_Hans
media_folder: media
public_folder: /Answer/media

collections:
  - name: posts
    label: 文章
    label_singular: 文章
    description: 新建、编辑和发布博客文章。保存后通常需要约一分钟同步到首页。
    folder: content/posts
    format: json
    slug: '{{fields._slug}}'
    preview_path: 'posts/{{slug}}/'
    summary: '{{title}} · {{date}}'
    sortable_fields: [date, title, category]
    view_filters:
      - { label: 已发布, field: published, pattern: true }
      - { label: 草稿, field: published, pattern: false }
    fields:
      - name: title
        label: 标题
        widget: string
      - name: date
        label: 发布时间
        widget: datetime
        default: '{{now}}'
        format: 'YYYY-MM-DDTHH:mm:ssZ'
      - name: category
        label: 分类
        widget: select
        options: [技术笔记, 生活随笔, 效率方法, 读书观影]
        default: 生活随笔
      - name: tags
        label: 标签
        widget: list
        required: false
        field: { name: tag, label: 标签, widget: string }
      - name: excerpt
        label: 摘要
        widget: text
        hint: 显示在首页文章卡片中，建议控制在 80 字以内。
      - name: cover
        label: 封面图
        widget: image
        required: false
      - name: published
        label: 立即发布
        widget: boolean
        default: true
      - name: body
        label: 正文
        widget: richtext
