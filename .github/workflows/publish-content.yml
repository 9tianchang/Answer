name: Publish blog content

on:
  push:
    branches: [master]
    paths:
      - 'content/posts/**'
      - 'templates/post.html'
      - 'scripts/build-content.mjs'

permissions:
  contents: write

concurrency:
  group: publish-blog-content
  cancel-in-progress: false

jobs:
  build-content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate article index and pages
        run: node scripts/build-content.mjs
      - name: Commit generated pages
        run: |
          if git diff --quiet -- data/posts.json posts; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/posts.json posts
          git commit -m "Publish blog content [skip ci]"
          git push origin master
