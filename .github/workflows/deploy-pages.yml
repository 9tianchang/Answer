name: 发布 Hexo 博客

on:
  push:
    branches: [hexo]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 获取博客源码
        uses: actions/checkout@v4
      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: 启用 pnpm
        run: corepack enable
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      - name: 生成网站
        run: pnpm run build
      - name: 配置 GitHub Pages
        uses: actions/configure-pages@v5
      - name: 上传网站
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 发布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
